plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.+'
}

group = project.mod_group_id
version = project.mod_version

base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

def epicFightJarName = "epicfight-forge-${project.epicfight_version}-${project.minecraft_version}.jar"
def epicFightJar = layout.projectDirectory.file("libs/${epicFightJarName}").asFile

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Curios Maven'
        url = 'https://maven.theillusivec4.top/'
    }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${project.curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${project.curios_version}")

    compileOnly fg.deobf(dependencies.create(name: "epicfight-forge-${project.epicfight_version}-${project.minecraft_version}"))
    runtimeOnly fg.deobf(dependencies.create(name: "epicfight-forge-${project.epicfight_version}-${project.minecraft_version}"))
}

def verifyEpicFightJar = tasks.register('verifyEpicFightJar') {
    group = 'verification'
    description = 'Validates that the local Epic Fight dependency jar is present.'

    doLast {
        if (!epicFightJar.exists()) {
            throw new GradleException(
                    "Missing Epic Fight dependency: ${project.relativePath(epicFightJar)}\n" +
                            "Download ${epicFightJarName} into the libs/ directory before running compile, build, or runClient.\n" +
                            'This repository keeps Epic Fight as a manual local dependency because this project does not resolve it from a public Maven repository.'
            )
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn verifyEpicFightJar
    options.encoding = 'UTF-8'
}

tasks.matching { it.name.startsWith('run') }.configureEach {
    dependsOn verifyEpicFightJar
}

jar {
    manifest {
        attributes([
                'Specification-Title'  : project.mod_name,
                'Specification-Vendor' : 'oneworldstudio',
                'Specification-Version': project.mod_version,
                'Implementation-Title' : project.mod_name,
                'Implementation-Version': project.mod_version,
                'Implementation-Vendor': 'oneworldstudio'
        ])
    }
}
