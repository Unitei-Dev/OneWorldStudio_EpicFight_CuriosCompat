name: Repository Checks

on:
  push:
    branches:
      - 1.20.1
      - main
  pull_request:

jobs:
  repository-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure wrapper is executable
        run: chmod +x gradlew

      - name: Verify public repository files
        run: |
          test -f README.md
          test ! -f README.txt
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f LICENSE
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f libs/README.md
          grep -q 'license="Apache-2.0"' src/main/resources/META-INF/mods.toml
          grep -q 'version="${file.jarVersion}"' src/main/resources/META-INF/mods.toml

      - name: Verify clean-clone Gradle entrypoint
        run: ./gradlew help
